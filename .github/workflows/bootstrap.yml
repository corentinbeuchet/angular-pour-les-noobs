name: Mise en place du dépôt

# Workflow temporaire : déballe bootstrap.tar.xz (dépôt alimenté par upload web),
# génère package-lock.json, vérifie le build, committe. À supprimer ensuite.
on:
  push:
    branches: [ main ]
    paths: [ 'bootstrap.tar.xz', '.github/workflows/bootstrap.yml' ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Déballer
        run: |
          tar -xJf bootstrap.tar.xz
          rm bootstrap.tar.xz
      - name: Générer package-lock.json
        run: npm install --no-audit --no-fund
      - name: Vérifier le build
        run: npm run build
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Projet de départ (Angular 22)"
          git push
